[project]
name            = "stemgen"
version         = "0.2.0"
description     = "Turn any track into a Native Instruments .stem.m4a with Demucs."
license         = "MIT"
readme          = "README.md"
# Pinned to 3.13 because Nuitka 4.0.x's support for 3.14 is still
# experimental (it generates broken code for f-strings in some
# site-packages). Bump to 3.14 once Nuitka catches up.
requires-python = ">=3.13,<3.14"

dependencies = [
    "PySide6>=6.6.0",
    "mutagen>=1.47.0",
    # Demucs pulls torch + torchaudio. The previous create_venv.sh forced
    # numpy 1.x on top of them; that was a torch<2.3 wheel/ABI problem and
    # torch>=2.6 wheels are built against numpy 2, so no pin is needed.
    "demucs>=4.0.1",
    "torchaudio>=2.6.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
# torch comes from exactly one of these two (they conflict — see [tool.uv]).
# `cpu` is plain PyPI torch: CPU-only on Windows, MPS-capable on macOS. It is
# what every default `make venv` / `.\make.ps1 venv` installs.
cpu = ["torch>=2.6.0"]
# `cuda` swaps in PyTorch's CUDA 13 build on Windows (RTX 20xx and newer; it
# falls back to CPU without a usable NVIDIA GPU). Build with
# `.\make.ps1 package -Variant cuda` — separate .venv-cuda / dist-cuda.
cuda = ["torch>=2.6.0"]
# Tools needed to ship a built .app / .exe — not required at runtime.
# Activate with: uv sync --extra build
build = [
    "nuitka>=4.0",
    "ordered-set",
    "zstandard",
    # Nuitka 4.x dropped its inline copy of markupsafe; the build
    # aborts with "FATAL: Error, expected inline copy of 'markupsafe'"
    # without it.
    "markupsafe>=2.1",
    # Styled .dmg (app + /Applications symlink + background) — see
    # scripts/dmg_settings.py.
    "dmgbuild>=1.6; sys_platform == 'darwin'",
]
# Dev-only — linting, formatting, testing.
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cuda" }],
]

[tool.uv.sources]
# Only the cuda extra, only on Windows, reads the PyTorch index; everything
# else resolves torch from PyPI. Guarded by tests/unit/test_torch_variants.py.
torch = [
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name     = "pytorch-cu130"
url      = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ holds flat modules, not a package — list them so `pip install .`
# produces a wheel with code in it rather than metadata only.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules  = ["StemGenApp", "stemgen", "ni_stem", "metadata", "layout", "runtime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests/unit"]

[tool.ruff]
line-length    = 100
target-version = "py313"
extend-exclude = ["venv", ".venv", "build", "dist", "dist-nuitka", "src/layout.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLC0415"]
ignore = ["E501"]   # line length governed by formatter
